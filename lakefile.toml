name = "adversarial-bco"
version = "2.1.0"
description = "Optimal regret for adversarial bandit convex optimisation in polynomial time: regret d^(3/2) sqrt(n) up to logarithms with polynomial-time steps in the bit model, and a matching lower bound (Conjecture 1 of Bubeck, Eldan and Lee)"
keywords = ["math", "formal verification", "bandit convex optimisation", "online learning", "minimax regret"]
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
preferReleaseBuild = true
releaseRepo = "https://github.com/mt0-svg/adversarial-bco"
defaultTargets = ["Statement", "Main", "Challenge"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# The frozen statements: the bit-model upper bound (StatementConj1Bit, over the machine of StatementBitRAM and the
# statement files it imports), its corollary in expectation (StatementConj1BitExp) and the lower bound on a polytope
# (StatementConj1LowerPoly), with the statement files the proofs import.
[[lean_lib]]
name = "Statement"
roots = ["AdversarialBco.Statement", "AdversarialBco.StatementBody", "AdversarialBco.StatementPoly",
  "AdversarialBco.StatementConj1", "AdversarialBco.StatementConj1Lower", "AdversarialBco.StatementConj1Poly",
  "AdversarialBco.StatementBitRAM", "AdversarialBco.StatementConj1Bit", "AdversarialBco.StatementConj1BitExp",
  "AdversarialBco.StatementConj1LowerPoly"]

# The development and the theorems.
[[lean_lib]]
name = "Main"
roots = ["AdversarialBco.Conj1Bit.Main", "AdversarialBco.Conj1Bit.Exp", "AdversarialBco.Conj1BitExp.Main",
  "AdversarialBco.Conj1LowerPoly.Main"]
globs = ["AdversarialBco.Lemmas", "AdversarialBco.Body.+", "AdversarialBco.Body2.+", "AdversarialBco.Gauss.+",
  "AdversarialBco.Poly.+", "AdversarialBco.Conj1.+", "AdversarialBco.Conj1Exp.+", "AdversarialBco.Conj1Lower.+",
  "AdversarialBco.Conj1Poly.+", "AdversarialBco.Conj1PolyExp.+", "AdversarialBco.Bit.+",
  "AdversarialBco.Conj1Bit.+", "AdversarialBco.Conj1BitExp.+", "AdversarialBco.Conj1LowerPoly.+"]

# The statements with `sorry`, which nothing imports: the challenges of config-conj1-bit.json, config-conj1-bit-exp.json
# and config-conj1-lower-poly.json (ChallengeConj1Bit, ChallengeConj1BitExp and ChallengeConj1LowerPoly, over the copies
# in ChallengeBase), whose theorems the modules named by the configurations prove.
[[lean_lib]]
name = "Challenge"
roots = ["AdversarialBco.ChallengeConj1Bit", "AdversarialBco.ChallengeConj1BitExp",
  "AdversarialBco.ChallengeConj1LowerPoly"]
globs = ["AdversarialBco.ChallengeConj1Bit", "AdversarialBco.ChallengeConj1BitExp",
  "AdversarialBco.ChallengeConj1LowerPoly", "AdversarialBco.ChallengeBase.+"]
