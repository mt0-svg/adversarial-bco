name = "adversarial-bco"
version = "2.1.0"
description = "Optimal regret for adversarial bandit convex optimisation in polynomial time: regret d^(3/2) sqrt(n) up to logarithms with polynomial-time steps in the bit model, and a matching lower bound (Conjecture 1 of Bubeck, Eldan and Lee)"
keywords = ["math", "formal verification", "bandit convex optimisation", "online learning", "minimax regret"]
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
preferReleaseBuild = true
releaseRepo = "https://github.com/mt0-svg/adversarial-bco"
defaultTargets = ["Statement", "Main", "Challenge"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# The frozen statements: Theorem U on the machine with the oracle (StatementUnified, over StatementBitRAMO and its bit
# machine StatementBitRAM), Theorem UW with log(1/delta) entering once (StatementUW), the lower bound with delta and the
# minimax theorem at its constants (StatementMinimaxQ, over the game and values of StatementMinimax and the polytope of
# StatementConj1LowerPolyD), the lower bound that grows with log(1/delta) and the minimax theorem matched in delta
# (StatementMatched), Corollary P on the plain bit RAM (StatementConj1BitHP, over StatementConj1Bit), with the statement
# files they import; and StatementBody, a statement file of v2.3 that modules of the development import (Body2.Gauss1,
# Poly.PosGauss).
[[lean_lib]]
name = "Statement"
roots = ["AdversarialBco.Statement", "AdversarialBco.StatementBody", "AdversarialBco.StatementPoly",
  "AdversarialBco.StatementConj1", "AdversarialBco.StatementConj1Lower", "AdversarialBco.StatementConj1Poly",
  "AdversarialBco.StatementBitRAM", "AdversarialBco.StatementConj1Bit", "AdversarialBco.StatementBitRAMO",
  "AdversarialBco.StatementUnified", "AdversarialBco.StatementUnifiedLower", "AdversarialBco.StatementMinimax",
  "AdversarialBco.StatementConj1LowerPolyD", "AdversarialBco.StatementMinimaxQ", "AdversarialBco.StatementUW",
  "AdversarialBco.StatementMatched", "AdversarialBco.StatementConj1BitHP"]

# The development and the theorems: the solution modules of the configurations config-*.json; with Unified.PolyBlk5, Unified.PolyEnv, Unified.PolyMach, Unified.PolyMain, Unified.PolyPro, Unified.PolyStep2, which hold declarations that the paper names
# outside their cone.
[[lean_lib]]
name = "Main"
roots = ["AdversarialBco.UW.TheoremU", "AdversarialBco.LowerDeltaQ.Minimax", "AdversarialBco.Matched.Main",
  "AdversarialBco.Conj1BitHP.Main", "AdversarialBco.Conj1.Main", "AdversarialBco.Unified.PolyBlk5", "AdversarialBco.Unified.PolyEnv", "AdversarialBco.Unified.PolyMach", "AdversarialBco.Unified.PolyMain", "AdversarialBco.Unified.PolyPro", "AdversarialBco.Unified.PolyStep2"]
globs = ["AdversarialBco.Lemmas", "AdversarialBco.Body.+", "AdversarialBco.Body2.+", "AdversarialBco.Gauss.+",
  "AdversarialBco.Poly.+", "AdversarialBco.Conj1.+", "AdversarialBco.Conj1Arith.+", "AdversarialBco.Conj1Exp.+",
  "AdversarialBco.Conj1Lower.+", "AdversarialBco.Conj1Poly.+", "AdversarialBco.Conj1Bit.+", "AdversarialBco.Conj1BitHP.+",
  "AdversarialBco.Conj1LowerPolyD.+", "AdversarialBco.Bit.+", "AdversarialBco.Lower.+", "AdversarialBco.LowerDelta.+",
  "AdversarialBco.LowerDeltaQ.+", "AdversarialBco.Minimax.+", "AdversarialBco.Unified.+",
  "AdversarialBco.UnifiedLower.+", "AdversarialBco.UW.+", "AdversarialBco.Grow.+", "AdversarialBco.Matched.+"]

# The statements with `sorry`, which nothing imports: the challenges of the configurations config-*.json
# (Challenge<NAME>.lean, over the copies in ChallengeBase), whose theorems the modules named by the configurations
# prove.
[[lean_lib]]
name = "Challenge"
roots = ["AdversarialBco.ChallengeUnified", "AdversarialBco.ChallengeUW", "AdversarialBco.ChallengeMinimaxQ",
  "AdversarialBco.ChallengeMatched", "AdversarialBco.ChallengeConj1BitHP", "AdversarialBco.ChallengeConj1"]
globs = ["AdversarialBco.ChallengeUnified", "AdversarialBco.ChallengeUW", "AdversarialBco.ChallengeMinimaxQ",
  "AdversarialBco.ChallengeMatched", "AdversarialBco.ChallengeConj1BitHP", "AdversarialBco.ChallengeConj1", "AdversarialBco.ChallengeBase.+"]
