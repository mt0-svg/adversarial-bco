# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "adversarial-bco"
  description: >-
    Adversarial bandit convex optimisation with a weak membership oracle, an adaptive adversary and a noisy
    observation. One program of a random access machine with logarithmic cost and a weak membership oracle plays each
    round, on every convex body given by the oracle and two rational balls about a known centre, within a number of bit
    operations polynomial in d, log n and the bit lengths of delta, the centre and the radii. Its regret is at most a
    constant times d^(3/2) sqrt(n) log^5(2dn) + d sqrt(n log(2/delta)) log^(9/2)(2dn) with probability at least
    1 - delta. On the same bodies, for d >= 4e6, n >= d^10, delta < 1/2 and log(1/delta) <= n/d^6, the minimax
    (1 - delta)-quantile of the regret is at least a constant times
    d^(3/2) sqrt(n)/log d + d sqrt(n log(1/delta))/(log d sqrt(log n)), and the minimax mean of its positive part at
    least a constant times d^(3/2) sqrt(n)/log d; the program attains both up to factors polylogarithmic in d and n.
  authors: [mt0-svg]
  license: "Apache-2.0"

sources:
  - title: "Kernel-based methods for bandit convex optimization"
    authors: ["Sébastien Bubeck", "Ronen Eldan", "Yin Tat Lee"]
    id: "https://doi.org/10.1145/3453721"
    type: article
    location: "Conjecture 1 (arXiv:1607.03084): the lower bound in mean on the cube, Corollary 1.8 of the original proof"
    relationship: background
    author_endorsement: not-contacted
  - title: "Optimal regret for adversarial bandit convex optimisation in polynomial time"
    authors: [mt0-svg]
    id: "https://github.com/mt0-svg/adversarial-bco"
    type: original-proof
    location: "paper/main.tex, Theorems 1.2 to 1.7 and 3.2 and Corollary 1.8, in the form of Section 8.1"
    relationship: formalizes
    author_endorsement: n/a

related_formalizations: []

classification:
  arxiv: ["cs.LG", "math.OC", "stat.ML"]
  msc2020: ["68Q32", "90C25", "62L05", "03B35"]

