# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "adversarial-bco"
  description: >-
    Adversarial bandit convex optimisation with a weak membership oracle, an adaptive adversary and a noisy
    observation. One program of a random access machine with logarithmic cost and a weak membership oracle plays each
    round, on every convex body given by the oracle and two rational balls about a known centre, within a number of bit
    operations polynomial in d, log n, log(1/delta) and the bit length of the centre and the radii, and has regret at
    most a constant times d^(3/2) sqrt(n) log^5(2dn/delta) with probability at least 1 - delta. On the same bodies, for
    d >= 4e6 and n >= d^10, every learner has regret at least 7e-9 d^(3/2) sqrt(n)/log d in mean and
    2.8e-9 d^(3/2) sqrt(n)/log d with probability at least 1/2 against some adversary. On the polytopes of Bubeck,
    Eldan and Lee this gives their Conjecture 1 with time counted in bit operations.
  authors: [mt0-svg]
  license: "Apache-2.0"

sources:
  - title: "Kernel-based methods for bandit convex optimization"
    authors: ["Sébastien Bubeck", "Ronen Eldan", "Yin Tat Lee"]
    id: "https://doi.org/10.1145/3453721"
    type: article
    location: "Conjecture 1 (arXiv:1607.03084), with time in bit operations: Corollary 1.5 of the original proof"
    relationship: background
    author_endorsement: not-contacted
  - title: "Optimal regret for adversarial bandit convex optimisation in polynomial time"
    authors: [mt0-svg]
    id: "https://github.com/mt0-svg/adversarial-bco"
    type: original-proof
    location: "paper/main.tex, Theorems 1.2, 1.3 and 3.2 and Corollaries 1.4 and 1.5, in the form of Section 7.1"
    relationship: formalizes
    author_endorsement: n/a

related_formalizations: []

