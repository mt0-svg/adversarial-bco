fidelity:
  divergences: >-
    Theorems 1.1 and 1.3, Remark 1.2 and Corollary 8.6 state the program as a list of instructions of the machine of
    Definition 8.1, number the rounds from 0, ask a strategy for a loss convex on the body with values in [0, 1] and
    Borel in the history, and measure the probability by the outer measure of the product law; Theorems 1.1 and 1.3 (b)
    give a measurable function above the regret on every run and bound its expectation. Theorem 1.4 asks the learner to be jointly
    measurable and states that the regret is integrable. Theorem 1.5 takes the scan order of the net and the
    procedure of step 1 of Algorithm 7.1 as arguments, holds for every order and every procedure that meets step 1 at
    every positive probability vector, and states that both exist; its probability space is the finite set of
    histories of actions and coins with the product law. Theorem 3.1 states its conclusions for every entropic
    Gaussian at the temperature, with the existence of one. corollaryADV states Corollary 1.6 with no value of the
    constant, n >= 2, and the infimum over learners that are a probability space of seeds and, for each round, a
    jointly measurable map from the seed and the past observations to the body, whose regret is integrable against
    every sequence of losses (Section 11.1 of the paper). The other statements are proved as steps, in places in
    the form the proofs use (Section 11.2 of the paper).

review:
  status: agent-reviewed
  notes: "the proof was refereed by agents with fresh context; Comparator checks the seventeen main statements against nine statement files that import only Mathlib."

