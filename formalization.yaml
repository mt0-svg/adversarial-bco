# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "adversarial-bco"
  description: >-
    Adversarial bandit convex optimisation, Conjecture 1 of Bubeck, Eldan and Lee in their game, where each loss may
    depend on the earlier plays, with time counted in bit operations. On their polytopes, given by m rational
    constraints whose numerators and denominators are at most M in absolute value, one program of a random access
    machine with logarithmic cost plays each round within a number of bit operations polynomial in d, m, log n and
    log M and has regret at most a constant times d^(3/2) sqrt(n) log^5(2dn), in upper expectation and in
    expectation. On the cube, for d >= 4e6 and n >= d^10, every learner has expected regret at least
    7e-9 d^(3/2) sqrt(n)/log d against some adversary.
  authors: [mt0-svg]
  license: "Apache-2.0"

sources:
  - title: "Kernel-based methods for bandit convex optimization"
    authors: ["Sébastien Bubeck", "Ronen Eldan", "Yin Tat Lee"]
    id: "https://doi.org/10.1145/3453721"
    type: article
    location: "Conjecture 1 (arXiv:1607.03084): its first sentence on their polytopes with time in bit operations (Theorem 1.1 and Corollary 1.2 of the original proof), its second on the cube (Theorem 1.3)"
    relationship: background
    author_endorsement: not-contacted
  - title: "Optimal regret for adversarial bandit convex optimisation in polynomial time"
    authors: [mt0-svg]
    id: "https://github.com/mt0-svg/adversarial-bco"
    type: original-proof
    location: "paper/main.tex, Theorems 1.1 and 1.3 and Corollary 1.2, in the form of Section 6.1"
    relationship: formalizes
    author_endorsement: n/a

related_formalizations: []

