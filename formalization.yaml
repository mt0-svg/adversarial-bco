automation:
  methods:
    - method: agent

fidelity:
  divergences: >-
    Theorems 1.1 and 1.3 number the rounds from 0, give the polytope by a rational matrix and vector, bound the
    numerator and denominator of each entry in lowest terms by the height, allow any centre for the unit ball and
    write the diameter hypothesis as |x - y| <= n on the polytope. Theorem 1.1 states the program as a list of
    instructions of Definition 3.1, asks the loss of a randomised adversary on every sequence of rational points to be
    convex with values in [0, 1] on the polytope for every seed and measurable in the seed, and gives a measurable
    function above the regret whose lower integral is at most the bound; Corollary 1.2 states that the regret is
    integrable and bounds its integral. Theorem 1.3 asks a learner to be jointly measurable and a strategy to be
    a function of the earlier points alone, 1/4-Lipschitz and Borel in the history, asks the regret to be integrable, and asserts a polytope of the
    class without naming it. The other statements are proved as steps, in places in the form the proofs use (Section
    6.2 of the paper).

