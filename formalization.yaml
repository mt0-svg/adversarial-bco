automation:
  methods:
    - method: agent

fidelity:
  divergences: >-
    Theorem 1.1 takes the scan order of the net and the procedure of step 1 of Algorithm 7.1 as arguments, holds for
    every order and every procedure that meets step 1 at every positive probability vector, and states that both
    exist; its probability space is the finite set of histories of actions and coins with the product law, and
    rounds are indexed from 0. Theorem 3.1 states its conclusions for every entropic Gaussian at the temperature,
    with the existence of one. corollaryADV states Corollary 1.2 with no value of the constant, n >= 2, and the
    infimum over learners that are a probability space of seeds and, for each round, a jointly measurable map from
    the seed and the past observations to the body, whose regret is integrable against every sequence of losses
    (Section 9.1 of the paper). The other statements are proved as steps, in places in the form the proofs use
    (Section 9.2 of the paper).

review:
  status: agent-reviewed
  notes: "the proof was refereed by agents with fresh context; Comparator checks the seven main statements against three statement files that import only Mathlib."

