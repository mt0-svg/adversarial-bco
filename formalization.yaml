  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "AdversarialBco.Explicit.theoremExplicit"
      file: "AdversarialBco/Explicit.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "config-explicit.json"
      literature_dependencies: []
    - declaration: "AdversarialBco.Explicit.lemmaMarg"
