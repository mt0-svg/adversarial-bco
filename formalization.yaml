automation:
  methods:
    - method: agent

fidelity:
  divergences: >-
    Every theorem numbers the rounds from 0. Theorem 1.2 states the program as a list of instructions of
    Definition 4.2, a weak membership oracle as a function from the rational points and the natural numbers to
    the booleans with the two clauses of the paper, and an environment as a probability space with measurable fair
    coins and losses and noises whose independences are independences of sigma-algebras and whose conditional moments
    are conditional expectations, almost everywhere; the cost clause asks that from every step with fewer than n rounds
    played some later step plays one more round at a cost at most B above the first. Theorem 1.3 asks a
    learner to be jointly measurable and a strategy to read no earlier observation, to take values in [1/8, 7/8] on the
    body and to be 1/(4 r0)-Lipschitz on R^d and Borel in the history; its clause on programs asks of the program what
    clause (i) of Theorem 1.2 asserts, with any cost bound; the powers are real powers at a positive base.
    Theorems 1.4 and 1.7 take as learners the programs of Definition 4.2 with two sequences of
    windows, and read both payoffs from the tail of the regret, with the outer measure on a set that is not measurable:
    the mean of the positive part is the integral of the tail over (0, infinity) and the quantile the infimum of the
    reals at which the tail is at most delta. Theorem 1.5 has the program, inputs, oracles and environments of
    Theorem 1.2, and Theorem 1.6 the learners, strategies and programs of Theorem 1.3, with the
    probability asserted strictly greater than delta. Corollary 1.8 gives the polytope by a rational matrix and
    vector, bounds the numerator and denominator of each entry in lowest terms by the height, allows any centre for the
    unit ball, writes the diameter hypothesis as |x - y| <= n, and asserts a polytope of the class without naming it.
    Theorem 3.2 states the program as a list of instructions of Definition 3.1. The other statements
    are proved as steps of these proofs (Section 8.2 of the paper).

review:
  status: agent-reviewed
  notes: "the proof was refereed by agents with fresh context; Comparator checks the main statements against their challenge files, which import only Mathlib."

