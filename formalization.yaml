# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "adversarial-bco"
  description: >-
    Adversarial bandit convex optimisation, Conjecture 1 of Bubeck, Eldan and Lee in their game, where each loss may
    depend on the earlier plays. On their polytopes, given by rational constraints, one program of a real RAM with
    exact square root, exponential and logarithm, Gaussian draws and spectral functions, with no membership
    question, makes each play within a number of steps polynomial in d, the number of constraints and log n (and log(1/delta) for the bound in
    probability), the first also in the logarithm of the height of the coefficients, and has regret at most a constant times
    d^(3/2) sqrt(n) log^5(2dn(n+1)) + 1 in upper expectation, and at most a constant times d^(3/2) sqrt(n)
    log^5(2dn/delta) with probability 1 - delta; Theorem 1.1 and Remark 1.2 are the same
    bounds on a convex body between two balls, with a membership oracle. On the unit ball, for d >= 4e6 and n >= d^10, every learner has expected regret at least
    7e-9 d^(3/2) sqrt(n)/log d against some adversary. Against losses fixed in advance, on a body that contains a unit ball and has diameter at most D,
    an explicit learner has regret at most 1.9e5 d^(3/2) sqrt(n) log^(3/2)(n D).
  authors: [mt0-svg]
  license: "Apache-2.0"

sources:
  - title: "Kernel-based methods for bandit convex optimization"
    authors: ["Sébastien Bubeck", "Ronen Eldan", "Yin Tat Lee"]
    id: "https://doi.org/10.1145/3453721"
    type: article
    location: "Conjecture 1 (arXiv:1607.03084): its first sentence on their polytopes with time on a real RAM (Theorem 1.3 of the original proof), its second on the unit ball (Theorem 1.4)"
    relationship: background
    author_endorsement: not-contacted
  - title: "Improved regret for zeroth-order adversarial bandit convex optimisation"
    authors: ["Tor Lattimore"]
    id: "https://doi.org/10.4171/MSL/17"
    type: article
    location: "Theorem 1: the bound C d^(5/2) sqrt(n) log(nD) that Theorem 1.5 and Corollary 1.6 of the original proof improve (arXiv:2006.00475)"
    relationship: background
    author_endorsement: not-contacted
  - title: "Adversarial bandit convex optimisation: regret d^(3/2) sqrt(n) with polynomial-time steps on a real RAM, and a matching lower bound"
    authors: [mt0-svg]
    id: "https://github.com/mt0-svg/adversarial-bco"
    type: original-proof
    location: "paper/main.tex, Theorems 1.1, 1.3, 1.4 and 1.5, Remark 1.2, Corollaries 1.6 and 8.6, Proposition 2.2, Theorem 3.1 and Lemma 7.13, in the form of Section 11.1"
    relationship: formalizes
    author_endorsement: n/a

