# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "adversarial-bco"
  description: >-
    Adversarial bandit convex optimisation: on a convex body of R^d containing a unit ball, an explicit learner has
    regret at most 1.9e5 d^(3/2) sqrt(n) log^(3/2)(n D) against convex losses with values in [0, 1] fixed in
    advance, and the minimax regret over n rounds obeys the same bound; the one-round inequality behind them holds
    with beta = 1.2e9 d^2 log(n d D) log(2n).
  authors: [mt0-svg]
  license: "Apache-2.0"

sources:
  - title: "Improved regret for zeroth-order adversarial bandit convex optimisation"
    authors: ["Tor Lattimore"]
    id: "https://doi.org/10.4171/MSL/17"
    type: article
    location: "Theorem 1: the bound C d^(5/2) sqrt(n) log(nD) that Theorem 1.1 and Corollary 1.2 of the original proof improve (arXiv:2006.00475)"
    relationship: background
    author_endorsement: not-contacted
  - title: "Adversarial bandit convex optimisation with regret d^(3/2) sqrt(n) up to logarithms"
    authors: [mt0-svg]
    id: "https://github.com/mt0-svg/adversarial-bco"
    type: original-proof
    location: "paper/main.tex, Theorem 1.1, Corollary 1.2, Proposition 2.2, Theorem 3.1 and Lemma 7.13, in the form of Section 9.1"
    relationship: formalizes
    author_endorsement: n/a

related_formalizations: []

classification:
  arxiv: ["cs.LG", "math.OC", "stat.ML"]
  msc2020: ["68Q32", "90C25", "62L05", "03B35"]

